  </g>

  <!-- Folhas de manjericão -->
  <g fill="#6E8238">
    <ellipse cx="268" cy="424" rx="16" ry="8" transform="rotate(-20 268 424)"/>
    <ellipse cx="290" cy="430" rx="14" ry="7" transform="rotate(15 290 430)"/>
  </g>
  <path d="M262 428l-10 6" stroke="#4A5C23" stroke-width="3" stroke-linecap="round"/>
